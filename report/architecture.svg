<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc">
<title id="title">PTCG policy architecture and evidence boundaries</title>
<desc id="desc">Historical typed entity and legal option policy, trained with game-level splits and behavioral cloning. Instance pointers connect options to entities. Inference returns constrained legal responses to the engine. Evaluation separately checks semantics and playing strength.</desc>
