name: serving-diagnostic
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.4.6
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s demo/tests_numeric
      - run: python demo/serving_diagnostic.py --boards 8 --reference-mode masked --serving-mode masked
